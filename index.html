<script>
(() => {
  const heart = document.querySelector('.heart');
  const rows = [...document.querySelectorAll('.word-row')];
  const centerY = 390;
  rows.forEach((row) => {
    const y = Number(row.getAttribute('y')) || centerY;
    const distance = Math.abs(y - centerY);
    // Начинаем из середины и раскрываем сердце волной вверх и вниз.
    row.style.setProperty('--delay', (0.35 + distance * 0.0085 + (Math.random() * 0.09)) + 's');
  });
  const lastDelay = Math.max(...rows.map(row => parseFloat(row.style.getPropertyValue('--delay')) || 0));
  window.setTimeout(() => heart.classList.add('is-complete'), (lastDelay + 1.1) * 1000);
})();
</script>
