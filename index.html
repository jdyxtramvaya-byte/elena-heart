<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080407">
<meta name="description" content="Для тебя — Леночка. Много красивых слов на языках мира.">
<title>Для тебя, Леночка ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080407}
body{font-family:Manrope,Arial,sans-serif;color:#fff}
main{position:relative;width:100%;height:100svh;min-height:420px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#2a0b16 0%,#160711 38%,#080407 76%)}
main:before{content:"";position:absolute;width:min(100vw,760px);aspect-ratio:1;border-radius:50%;background:#a51b4520;filter:blur(90px);pointer-events:none}
canvas{position:relative;z-index:1;width:min(100vw,820px);height:min(92svh,820px);display:block}
.center-name{position:absolute;z-index:2;left:50%;top:48%;transform:translate(-50%,-50%);white-space:nowrap;font-family:'Marck Script','Brush Script MT',cursive;font-size:clamp(54px,13vw,104px);font-weight:400;line-height:1;color:#fff1f2;text-shadow:0 2px 2px #6d102d,0 0 12px #ff9caf,0 0 32px #f0446b;opacity:0;animation:nameReveal 1.7s 4.9s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
.caption{position:absolute;z-index:2;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#e9a1b4;opacity:0;animation:captionReveal 1.2s 6.3s ease forwards}
@keyframes nameReveal{0%{opacity:0;transform:translate(-50%,-43%) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes captionReveal{to{opacity:.62}}
@media(max-width:520px){canvas{height:88svh}.caption{font-size:8px;letter-spacing:.25em}}
@media(prefers-reduced-motion:reduce){.center-name,.caption{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
<canvas id="heart" aria-label="Большое сердце из слов на разных языках"></canvas>
<div class="center-name">Леночка</div>
<div class="caption">для тебя</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('heart'),ctx=canvas.getContext('2d');
const words=[
'Ты прекрасна','Ты особенная','Твоя улыбка','Нежная душа','Ты сияешь','Ты чудесная','Ты вдохновляешь','Ты неповторимая','Ты очаровательна','Ты бесценна','Ты — радость','Ты — свет',
'You are lovely','Beautiful soul','You are amazing','One of a kind','You are sunshine','Simply beautiful','So precious','Shine bright','Pure magic','Lovely smile',
'Tu es magnifique','Tu es unique','Belle âme','Mon rayon de soleil','Sei meravigliosa','Anima bella','Eres preciosa','Alma bonita','Du bist wunderbar','Wunderschön',
'Você é especial','Alma linda','Jesteś piękna','Piękna dusza','Çok güzelsin','Είσαι υπέροχη','あなたは素敵','당신은 아름다워요','你很美','أنتِ رائعة',
'С тобой светлее','В тебе столько света','Твоя доброта','Тепло твоего сердца','Красота внутри и снаружи','Ты словно весна','Волшебство в глазах','Улыбайся чаще','Ты заслуживаешь счастья',
'Kind heart','Endless charm','Gentle beauty','A little wonder','Mon trésor','Dolcezza infinita','Eres maravillosa','Du bist einzigartig','笑顔がすてき','美丽的灵魂'
];
let W=0,H=0,D=1,rows=[],started=0,raf=0,shape;
function makeHeart(cx,cy,rx,ry){
 const p=new Path2D();
 p.moveTo(cx,cy+ry*.88);
 p.bezierCurveTo(cx-rx*.10,cy+ry*.62,cx-rx,cy+ry*.08,cx-rx,cy-ry*.34);
 p.bezierCurveTo(cx-rx,cy-ry*.83,cx-rx*.39,cy-ry*.98,cx,cy-ry*.56);
 p.bezierCurveTo(cx+rx*.39,cy-ry*.98,cx+rx,cy-ry*.83,cx+rx,cy-ry*.34);
 p.bezierCurveTo(cx+rx,cy+ry*.08,cx+rx*.10,cy+ry*.62,cx,cy+ry*.88);
 p.closePath();return p;
}
function setup(){
 const b=canvas.getBoundingClientRect();W=b.width;H=b.height;D=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 const rx=Math.min(W*.44,H*.37,340),ry=Math.min(H*.40,rx*1.08),cx=W/2,cy=H*.48;
 const path=makeHeart(cx,cy,rx,ry),font=Math.max(8,Math.min(W<520?11:13,rx/25)),step=font*1.62;
 rows=[];
 let k=0;
 for(let y=cy-ry*.91;y<=cy+ry*.84;y+=step){
  let left=W,right=0;
  for(let x=cx-rx;x<=cx+rx;x+=2){if(ctx.isPointInPath(path,x,y)){left=Math.min(left,x);right=Math.max(right,x)}}
  if(right>left+font*3)rows.push({y,left,right,phrase:words[k++%words.length]});
 }
 started=performance.now();return{path,cx,cy,rx,ry,font};
}
function draw(now){
 ctx.clearRect(0,0,W,H);
 const t=Math.min(1,(now-started)/5200);
 const total=rows.length,order=rows.map((_,i)=>i).sort((a,b)=>Math.abs(a-(total-1)/2)-Math.abs(b-(total-1)/2));
 const count=Math.ceil(total*(1-Math.pow(1-t,1.45)));
 const palette=['#ff6685','#ff8ca0','#f64d72','#ffb0b8','#e94a68','#ff7892'];
 ctx.save();ctx.shadowColor='#f52f62';ctx.shadowBlur=12;ctx.strokeStyle='#ff7996';ctx.globalAlpha=.34;ctx.lineWidth=1.2;ctx.stroke(shape.path);ctx.restore();
 for(let n=0;n<count;n++){
  const i=order[n],r=rows[i],span=r.right-r.left;
  const delay=Math.max(0,1-(count-n)/2);
  ctx.save();ctx.globalAlpha=.94*(1-delay*.45);
  ctx.font=(i%5===0?'700 ':'600 ')+shape.font+'px Manrope,Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const unit=r.phrase+'   ·   ',repeat=unit.repeat(Math.ceil(span/(shape.font*2.7))+3);
  ctx.fillStyle=palette[i%palette.length];ctx.shadowColor=palette[i%palette.length];ctx.shadowBlur=2.2;
  ctx.beginPath();ctx.rect(r.left,r.y-shape.font*.8,span,shape.font*1.6);ctx.clip();
  ctx.fillText(repeat,(r.left+r.right)/2,r.y);
  ctx.restore();
 }
 if(t>=1){
  const pulse=1+Math.sin(now/1100)*.009;
  ctx.save();ctx.translate(shape.cx,shape.cy);ctx.scale(pulse,pulse);ctx.translate(-shape.cx,-shape.cy);
  ctx.globalAlpha=.045;ctx.fillStyle='#ff456f';ctx.shadowColor='#ff456f';ctx.shadowBlur=36;
  ctx.fill(shape.path);ctx.restore();
 }
 raf=requestAnimationFrame(draw);
}
function init(){if(raf)cancelAnimationFrame(raf);shape=setup();raf=requestAnimationFrame(draw)}
if('ResizeObserver'in window)new ResizeObserver(init).observe(canvas);else addEventListener('resize',init);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(init);
init();
})();
</script>
</body>
</html>
