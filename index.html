<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050304">
<title>Для тебя, Леночка ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050304}
body{color:#fff;font-family:Manrope,Arial,sans-serif}
main{position:relative;width:100%;height:100svh;min-height:420px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#160609 0%,#0b0507 48%,#030203 100%)}
canvas{display:block;width:min(100vw,900px);height:min(94svh,900px);position:relative;z-index:1}
.center-name{position:absolute;z-index:2;left:50%;top:49%;transform:translate(-50%,-50%);font-family:'Marck Script','Brush Script MT',cursive;font-size:clamp(48px,12vw,92px);font-weight:400;white-space:nowrap;color:#fff0f1;text-shadow:0 0 9px #ff718b,0 0 24px #d9214d;opacity:0;animation:nameIn 1.5s 7s ease forwards;pointer-events:none}
.caption{position:absolute;z-index:2;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#bd6c7c;font-size:9px;letter-spacing:.38em;text-transform:uppercase;opacity:0;animation:captionIn 1.2s 8s ease forwards}
@keyframes nameIn{to{opacity:1}}@keyframes captionIn{to{opacity:.55}}
@media(max-width:520px){canvas{width:100vw;height:88svh}.caption{font-size:8px;letter-spacing:.28em}}
@media(prefers-reduced-motion:reduce){.center-name,.caption{animation:none;opacity:1}}
</style>
</head>
<body><main>
<canvas id="heart" aria-label="Сердце, составленное из строк с красивыми словами"></canvas>
<div class="center-name">Леночка</div>
<div class="caption">для тебя</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('heart'),ctx=canvas.getContext('2d');
const phrases=[
'Ты прекрасна','Твоя улыбка','Нежность души','Ты особенная','Свет внутри тебя','Ты восхитительна','Красота в деталях','Ты достойна счастья','Твоё очарование','Ты вдохновляешь','Тепло твоего сердца','Оставайся собой',
'You are beautiful','You are amazing','Beautiful soul','You are sunshine','Simply wonderful','One of a kind','Pure elegance','Endless charm','You are precious','Shine bright','So lovely','You make life brighter',
'Tu es magnifique','Tu es merveilleuse','Belle âme','Mon rayon de soleil','Pleine de douceur','Tu es unique','Quelle beauté','Un vrai trésor',
'Sei meravigliosa','Sei speciale','Anima bella','Dolcezza infinita','Sei splendida','Unica al mondo','Pura bellezza',
'Eres preciosa','Eres maravillosa','Alma bonita','Eres única','Mucho encanto','Luz de mi vida','Qué bonita',
'Du bist wunderschön','Du bist besonders','Wundervolle Seele','Einzigartig schön','Voller Zauber',
'Você é maravilhosa','Você é especial','Alma linda','Muito encanto','Você é única',
'Jesteś piękna','Jesteś wyjątkowa','Piękna dusza','Promieniejesz','Cudowna osoba',
'Çok güzelsin','Çok özelsin','Harika bir ruh','Eşsiz güzellik',
'Είσαι υπέροχη','Είσαι μοναδική','Όμορφη ψυχή',
'あなたは素敵','あなたは美しい','特別な人',
'당신은 아름다워요','당신은 특별해요','아름다운 마음',
'你很美','你很特别','美丽的灵魂','你的笑容很美',
'أنتِ رائعة','أنتِ جميلة','روح جميلة',
'Ты — маленькое чудо','С тобой светлее','Улыбайся чаще','Мир красивее с тобой','В тебе столько света','Твоя доброта бесценна','Ты словно весна','Неповторимая',
'Ma belle','Mon trésor','Belle comme le jour','Un sourire magnifique',
'Bella come un sogno','Tesoro prezioso','Luz e beleza','Doce encanto',
'Kind heart','Lovely smile','Pure magic','A gentle soul','Born to shine','A little wonder',
'Ты прекрасна во всём','Твоя искренность','Лёгкость и нежность','Удивительная девушка','Волшебство в глазах','Самая тёплая улыбка','Тонкая душевная красота','Ты заслуживаешь лучшего',
'Ты — вдохновение','Нежность и сила','Твоя магия','Сияй и улыбайся','Красивых тебе мгновений','Пусть сбываются мечты'
];
let W=0,H=0,D=1,rows=[],started=0,raf=0;
function heartPath(cx,cy,rx,ry){
 const p=new Path2D();
 p.moveTo(cx,cy+ry*.94);
 p.bezierCurveTo(cx-rx*1.18,cy+ry*.22,cx-rx*1.12,cy-ry*.72,cx-rx*.55,cy-ry*.83);
 p.bezierCurveTo(cx-rx*.24,cy-ry*.91,cx-rx*.08,cy-ry*.70,cx,cy-ry*.48);
 p.bezierCurveTo(cx+rx*.08,cy-ry*.70,cx+rx*.24,cy-ry*.91,cx+rx*.55,cy-ry*.83);
 p.bezierCurveTo(cx+rx*1.12,cy-ry*.72,cx+rx*1.18,cy+ry*.22,cx,cy+ry*.94);
 p.closePath();return p;
}
function setup(){
 const b=canvas.getBoundingClientRect();W=b.width;H=b.height;D=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 const rx=Math.min(W*.39,H*.34,310),ry=Math.min(H*.39,rx*1.13),cx=W/2,cy=H*.48;
 const path=heartPath(cx,cy,rx,ry);
 // Rasterize the silhouette once. Each text row uses only the pixels inside the heart.
 const mask=document.createElement('canvas');mask.width=Math.ceil(W);mask.height=Math.ceil(H);
 const m=mask.getContext('2d');m.fillStyle='#fff';m.fill(path);
 const data=m.getImageData(0,0,mask.width,mask.height).data;
 const font=Math.max(8,Math.min(W<520?10.5:12.5,rx/26)),step=font*1.58;
 rows=[];let phraseIndex=0;
 for(let y=Math.floor(cy-ry*.9);y<=Math.ceil(cy+ry*.9);y+=step){
  let left=-1,right=-1;
  for(let x=Math.floor(cx-rx*1.2);x<=Math.ceil(cx+rx*1.2);x++){
   const pos=(Math.min(mask.height-1,Math.max(0,y))*mask.width+Math.min(mask.width-1,Math.max(0,x)))*4+3;
   if(data[pos]>100){if(left<0)left=x;right=x}
  }
  if(left>=0&&right-left>font*2.8){
   rows.push({y,left,right,phrase:phrases[phraseIndex++%phrases.length]});
  }
 }
 started=performance.now();return{cx,cy,rx,ry,font};
}
let shape;
function draw(now){
 ctx.clearRect(0,0,W,H);
 const elapsed=(now-started)/1000;
 const reveal=Math.min(1,elapsed/7.2);
 // Lines emerge progressively from the upper cleft and spread down into the heart.
 const count=Math.floor(rows.length*reveal);
 const colors=['#ff493d','#ff5b48','#f43b32','#ff765e','#e93632','#ff654f'];
 for(let i=0;i<count;i++){
  const r=rows[i],span=r.right-r.left;
  ctx.save();
  const fade=Math.min(1,(reveal*rows.length-i)/2.4);
  ctx.globalAlpha=.96*fade;
  ctx.font=(i%4===0?'700 ':'600 ')+shape.font+'px Manrope,Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const phrase=r.phrase+'   ·   ';
  const measure=ctx.measureText(phrase).width;
  let line='';
  while(ctx.measureText(line+phrase).width<span+measure)line+=phrase;
  ctx.beginPath();ctx.rect(r.left,r.y-shape.font*.72,span,shape.font*1.45);ctx.clip();
  ctx.fillStyle=colors[i%colors.length];ctx.shadowColor=colors[i%colors.length];ctx.shadowBlur=2;
  ctx.fillText(line,(r.left+r.right)/2,r.y);
  ctx.restore();
 }
 raf=requestAnimationFrame(draw);
}
function init(){if(raf)cancelAnimationFrame(raf);shape=setup();raf=requestAnimationFrame(draw)}
if('ResizeObserver'in window)new ResizeObserver(init).observe(canvas);else addEventListener('resize',init);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(init);
init();
})();
</script>
</body></html>
